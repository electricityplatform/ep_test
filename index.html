<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity</title>
    <!-- تضمين Tailwind CSS للتنسيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تضمين مكتبة Supabase للاتصال بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-2 sm:p-4 flex items-center justify-center relative overflow-x-hidden">

    <!-- القائمة الجانبية (Sidebar) المخفية افتراضياً -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity opacity-0 duration-300"></div>
    <div id="sideMenu" class="fixed top-0 right-0 h-full w-72 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
        <!-- رأس القائمة الجانبية -->
        <div class="p-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
            <h3 class="font-bold text-gray-800 text-base">القائمة الرئيسية</h3>
            <button onclick="toggleSidebar()" class="p-2 text-gray-500 hover:text-red-500 rounded-xl transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <!-- محتوى القائمة الجانبية الديناميكي -->
        <div id="sidebarContent" class="flex-1 overflow-y-auto p-4 space-y-2">
            <!-- يتم تعبئتها ديناميكياً -->
        </div>
    </div>

    <!-- البطاقة البيضاء الرئيسية - ملء الشاشة (Full Screen Card) -->
    <div class="bg-white w-full h-[96vh] sm:h-[94vh] rounded-3xl shadow-2xl p-4 sm:p-8 flex flex-col justify-between transition-all duration-300 overflow-hidden">
        
        <!-- حاوية الشاشات الديناميكية -->
        <div id="appContainer" class="flex-1 flex flex-col overflow-hidden"></div>

    </div>

    <!-- كود الجافاسكريبت لإدارة النظام والصفحات والـ RPC المحددة فقط -->
    <script>
        // ================= 1. المتغيرات وإعدادات الاتصال =================
        const SUPABASE_URL = 'https://glwwvrgvbfygqbmqlnfn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_bCXPU0JSPeF-tG4OkHSXsQ_wyyRyC0w';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUserId = null;
        let selectedBrand = "";
        let selectedModel = "";
        let selectedPart = "";
        let selectedModelCode = ""; 
        let currentScreenCompatibility = "";
        let currentBatteryModel = "";
        let heartbeatInterval = null;

        // ================= نظام الهيرت بيت (Heartbeat) =================
        function startHeartbeat() {
            if (heartbeatInterval) clearInterval(heartbeatInterval);

            heartbeatInterval = setInterval(async () => {
                if (!currentUserId) return;

                try {
                    await supabaseClient.rpc('update_last_active_at', {
                        target_user_id: currentUserId
                    });
                } catch (err) {
                    console.error("Heartbeat error:", err);
                }
            }, 10000);
        }

        // ================= دالة عرض شاشة سجل تسجيل الدخول =================
        async function renderLoginHistoryScreen() {
            toggleSidebar();

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 cursor-pointer">
                            <svg class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            <span>رجوع</span>
                        </button>
                        <button type="button" onclick="event.stopPropagation(); fetchAndDisplayLoginHistory();" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 border border-blue-200 cursor-pointer" title="تحديث البيانات">
                            <svg class="w-4 h-4 transform transition-transform hover:rotate-180 duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            <span>تحديث</span>
                        </button>
                    </div>
                    <h2 id="loginHistoryTitle" class="text-sm sm:text-base font-bold text-gray-800 flex items-center gap-2">
                        <span class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></span>
                        سجل دخول المستخدمين
                    </h2>
                </div>
                <div id="loginHistoryTableContainer" class="flex-1 overflow-y-auto p-1">
                    <div class="text-center text-gray-400 text-sm py-8">جاري جلب سجل الدخول...</div>
                </div>
            `;

            loadDynamicMenuIntoSidebar();
            await fetchAndDisplayLoginHistory();
        }

        // ================= دالة جلب وعرض سجل الدخول =================
        async function fetchAndDisplayLoginHistory() {
            const tableContainer = document.getElementById('loginHistoryTableContainer');
            const titleElement = document.getElementById('loginHistoryTitle');
            
            if (tableContainer) {
                tableContainer.innerHTML = `<div class="text-center text-gray-400 text-sm py-8">جاري تحديث البيانات...</div>`;
            }

            try {
                const { data, error } = await supabaseClient.rpc('get_login_history', {
                    p_user_id: currentUserId
                });

                if (error) {
                    showSystemAlert("خطأ في جلب سجل الدخول", currentUserId || "غير معروف", "get_login_history", error.message);
                    if (tableContainer) tableContainer.innerHTML = `<div class="text-center text-red-400 text-sm py-8">تعذر جلب البيانات</div>`;
                    return;
                }

                let historyList = [];
                if (Array.isArray(data)) {
                    historyList = data;
                } else if (typeof data === 'string') {
                    try { historyList = JSON.parse(data); } catch(e){}
                }

                if (titleElement) {
                    titleElement.innerHTML = `
                        <span class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></span>
                        سجل دخول المستخدمين (${historyList.length})
                    `;
                }

                let contentHtml = "";
                if (historyList.length > 0) {
                    contentHtml = `
                        <div class="overflow-x-auto rounded-2xl border border-gray-200 shadow-sm">
                            <table class="w-full text-right text-xs sm:text-sm">
                                <thead class="bg-gray-50 text-gray-700 border-b border-gray-200">
                                    <tr>
                                        <th class="p-3.5 font-bold">وقت الدخول</th>
                                        <th class="p-3.5 font-bold">الرتبة</th>
                                        <th class="p-3.5 font-bold">الاسم</th>
                                        <th class="p-3.5 font-bold">رقم الهاتف</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100 bg-white">
                                    ${historyList.map(item => `
                                        <tr class="hover:bg-blue-50/50 transition-all">
                                            <td class="p-3.5 font-mono text-gray-600" dir="ltr">${item.login_times || '---'}</td>
                                            <td class="p-3.5">
                                                <span class="px-2.5 py-1 rounded-full text-xs font-bold ${
                                                    (item.user_role === 'admin' || item.user_role === 'أدمن') ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'
                                                }" dir="auto">
                                                    ${item.user_role || 'مستخدم'}
                                                </span>
                                            </td>
                                            <td class="p-3.5 font-semibold text-gray-800" dir="auto">${item.user_name || 'بدون اسم'}</td>
                                            <td class="p-3.5 font-mono text-gray-600" dir="ltr">${item.phone_number || '---'}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                } else {
                    contentHtml = `
                        <div class="text-center text-gray-500 py-12 bg-gray-50 rounded-2xl border border-gray-200">
                            <p class="font-semibold">لا توجد سجلات دخول متاحة حالياً</p>
                        </div>
                    `;
                }

                if (tableContainer) {
                    tableContainer.innerHTML = contentHtml;
                }
            } catch (err) {
                console.error("Error fetching login history:", err);
            }
        }

        // ================= دالة عرض شاشة المستخدمين النشطين (الهيكل الأساسي) =================
        async function renderActiveUsersScreen() {
            toggleSidebar();

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 cursor-pointer">
                            <svg class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            <span>رجوع</span>
                        </button>
                        <button type="button" onclick="event.stopPropagation(); fetchAndDisplayActiveUsers();" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 border border-blue-200 cursor-pointer" title="تحديث البيانات">
                            <svg class="w-4 h-4 transform transition-transform hover:rotate-180 duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            <span>تحديث</span>
                        </button>
                    </div>
                    <h2 id="activeUsersTitle" class="text-sm sm:text-base font-bold text-gray-800 flex items-center gap-2">
                        <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
                        المستخدمون النشطون
                    </h2>
                </div>
                <div id="activeUsersTableContainer" class="flex-1 overflow-y-auto p-1">
                    <div class="text-center text-gray-400 text-sm py-8">جاري جلب المستخدمين النشطين...</div>
                </div>
            `;

            loadDynamicMenuIntoSidebar();
            await fetchAndDisplayActiveUsers();
        }

        async function fetchAndDisplayActiveUsers() {
            const tableContainer = document.getElementById('activeUsersTableContainer');
            const titleElement = document.getElementById('activeUsersTitle');
            
            if (tableContainer) {
                tableContainer.innerHTML = `<div class="text-center text-gray-400 text-sm py-8">جاري تحديث البيانات...</div>`;
            }

            try {
                const { data, error } = await supabaseClient.rpc('get_active_users', {
                    p_user_id: currentUserId
                });

                if (error) {
                    showSystemAlert("خطأ في جلب النشطين", currentUserId || "غير معروف", "get_active_users", error.message);
                    if (tableContainer) tableContainer.innerHTML = `<div class="text-center text-red-400 text-sm py-8">تعذر جلب البيانات</div>`;
                    return;
                }

                let activeUsers = [];
                if (Array.isArray(data)) {
                    activeUsers = data;
                } else if (typeof data === 'string') {
                    try { activeUsers = JSON.parse(data); } catch(e){}
                }

                if (titleElement) {
                    titleElement.innerHTML = `
                        <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
                        المستخدمون النشطون (${activeUsers.length})
                    `;
                }

                let contentHtml = "";
                if (activeUsers.length > 0) {
                    contentHtml = `
                        <div class="overflow-x-auto rounded-2xl border border-gray-200 shadow-sm">
                            <table class="w-full text-right text-xs sm:text-sm">
                                <thead class="bg-gray-50 text-gray-700 border-b border-gray-200">
                                    <tr>
                                        <th class="p-3.5 font-bold">الرتبة</th>
                                        <th class="p-3.5 font-bold">الاسم</th>
                                        <th class="p-3.5 font-bold">رقم الهاتف</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100 bg-white">
                                    ${activeUsers.map(user => `
                                        <tr class="hover:bg-blue-50/50 transition-all">
                                            <td class="p-3.5">
                                                <span class="px-2.5 py-1 rounded-full text-xs font-bold ${
                                                    (user.user_role === 'admin' || user.user_role === 'أدمن') ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'
                                                }" dir="auto">
                                                    ${user.user_role || 'مستخدم'}
                                                </span>
                                            </td>
                                            <td class="p-3.5 font-semibold text-gray-800" dir="auto">${user.user_name || 'بدون اسم'}</td>
                                            <td class="p-3.5 font-mono text-gray-600" dir="ltr">${user.phone_number || '---'}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                } else {
                    contentHtml = `
                        <div class="text-center text-gray-500 py-12 bg-gray-50 rounded-2xl border border-gray-200">
                            <p class="font-semibold">لا يوجد مستخدمون نشطون في آخر 21 ثانية</p>
                        </div>
                    `;
                }

                if (tableContainer) {
                    tableContainer.innerHTML = contentHtml;
                }
            } catch (err) {
                console.error("Error fetching active users:", err);
            }
        }

        function showSystemAlert(title, idStatus, menuStatus, errorDetails = "") {
            let message = `--- 🔍 تقرير حالة النظام والأخطاء ---\n\n`;
            message += `📌 الحدث: ${title}\n`;
            message += `🆔 حالة الـ ID: ${idStatus}\n`;
            message += `📋 حالة جلب البيانات: ${menuStatus}\n`;
            if (errorDetails) {
                message += `⚠ تفاصيل العطل / السبب: ${errorDetails}\n`;
            } else {
                message += `✅ الحالة العامة: سليم بدون أخطاء\n`;
            }
            alert(message);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sideMenu');
            const overlay = document.getElementById('sidebarOverlay');
            
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function getHeaderTemplate() {
            return `
                <div class="border-b border-gray-100 pb-4 mb-4 flex-shrink-0">
                    <div class="text-center mb-3">
                        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-wide">Electricity</h1>
                    </div>
                    <div class="flex items-center justify-between mb-4">
                        <button onclick="toggleSidebar()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs sm:text-sm rounded-xl px-4 py-2.5 flex items-center gap-2 shadow-sm transition-all cursor-pointer">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                            <span>القائمة</span>
                        </button>
                    </div>
                </div>
            `;
        }

        // ================= 2. دالة جلب المنيو الرئيسية (مطابقة صحيحة تماماً لنص سجل دخول المستخدمين) =================
        async function loadDynamicMenuIntoSidebar() {
            const sidebarContainer = document.getElementById('sidebarContent');
            if (!sidebarContainer) return;

            sidebarContainer.innerHTML = `<div class="text-center text-gray-400 text-xs py-4">جاري التحميل...</div>`;

            try {
                const { data, error } = await supabaseClient.rpc('get_main_menu', {
                    p_user_id: currentUserId
                });

                if (error) {
                    sidebarContainer.innerHTML = `<div class="text-center text-red-400 text-xs py-4">تعذر تحميل القائمة</div>`;
                    return;
                }

                let menuItems = [];
                if (Array.isArray(data)) {
                    menuItems = data;
                } else if (typeof data === 'string') {
                    try { menuItems = JSON.parse(data); } catch(e){}
                }

                if (menuItems && menuItems.length > 0) {
                    sidebarContainer.innerHTML = menuItems.map(item => {
                        let clickAction = `alert('${item}')`;
                        
                        if (item.includes('المستخدمون النشطون')) {
                            clickAction = "renderActiveUsersScreen()";
                        } else if (item.includes('سجل دخول المستخدمين') || item.includes('سجل الدخول')) {
                            clickAction = "renderLoginHistoryScreen()";
                        }

                        return `
                            <div onclick="${clickAction}" class="w-full bg-gray-50 hover:bg-blue-50 border border-gray-200 hover:border-blue-200 p-3 rounded-xl cursor-pointer transition-all text-sm font-semibold text-gray-800 flex items-center justify-between">
                                <span dir="auto">${item}</span>
                                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            </div>
                        `;
                    }).join('');
                } else {
                    sidebarContainer.innerHTML = `<div class="text-center text-gray-400 text-xs py-4">لا توجد عناصر متاحة</div>`;
                }
            } catch (err) {
                sidebarContainer.innerHTML = `<div class="text-center text-red-400 text-xs py-4">خطأ في الاتصال</div>`;
            }
        }

        function renderLoginScreen() {
            const html = `
                <div class="flex-1 overflow-y-auto px-2">
                    <div class="max-w-xl mx-auto w-full py-4">
                        <div class="text-center mb-6">
                            <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-wide">Electricity</h1>
                        </div>

                        <div id="loginFormContainer">
                            <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">رقم الهاتف</label>
                                    <input type="text" id="loginPhone" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50" dir="ltr">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-600 mb-1">رمز المرور</label>
                                    <input type="password" id="loginPassword" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50" dir="ltr">
                                </div>
                                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all text-sm cursor-pointer">
                                    تسجيل الدخول
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            const { data, error } = await supabaseClient.rpc('login', { 
                p_phone_number: phone, 
                p_password: password 
            });

            if (error || !data || !data.id) {
                showSystemAlert("خطأ في تسجيل الدخول", phone || "غير متوفر", "فشل التحقق", error?.message || data?.message || "بيانات غير صحيحة");
                return;
            }

            currentUserId = data.id; 

            startHeartbeat();
            renderMainDashboard();
            loadDynamicMenuIntoSidebar(); 
        }

        function renderMainDashboard() {
            document.getElementById('appContainer').innerHTML = `
                ${getHeaderTemplate()}
                <div class="flex-1 flex items-center justify-center">
                    <p class="text-gray-600 font-bold text-lg">أهلاً بك في لوحة التحكم الرئيسية</p>
                </div>
            `;
            loadDynamicMenuIntoSidebar();
        }

        window.onload = function() {
            renderLoginScreen();
        };
    </script>
</body>
</html>
