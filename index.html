<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity</title>
    <!-- تضمين Tailwind CSS للتنسيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تضمين مكتبة Supabase للاتصال بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-2 sm:p-4 flex items-center justify-center relative overflow-x-hidden">

    <!-- القائمة الجانبية (Sidebar) المخفية افتراضياً -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity opacity-0 duration-300"></div>
    <div id="sideMenu" class="fixed top-0 right-0 h-full w-72 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
        <!-- رأس القائمة الجانبية -->
        <div class="p-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
            <h3 class="font-bold text-gray-800 text-base">القائمة الرئيسية</h3>
            <button onclick="toggleSidebar()" class="p-2 text-gray-500 hover:text-red-500 rounded-xl transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <!-- محتوى القائمة الجانبية الديناميكي -->
        <div id="sidebarContent" class="flex-1 overflow-y-auto p-4 space-y-2">
            <!-- يتم تعبئتها ديناميكياً -->
        </div>
    </div>

    <!-- البطاقة البيضاء الرئيسية - ملء الشاشة (Full Screen Card) -->
    <div class="bg-white w-full h-[96vh] sm:h-[94vh] rounded-3xl shadow-2xl p-4 sm:p-8 flex flex-col justify-between transition-all duration-300 overflow-hidden">
        
        <!-- حاوية الشاشات الديناميكية -->
        <div id="appContainer" class="flex-1 flex flex-col overflow-hidden"></div>

    </div>

    <!-- نافذة الفلترة الهرمية المنبثقة العامة (Modal) -->
    <div id="filterModalOverlay" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 transition-opacity opacity-0 duration-300">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-6 space-y-4 transform scale-95 transition-transform duration-300" id="filterModalContent">
            <div class="flex items-center justify-between border-b border-gray-100 pb-3">
                <h3 class="font-bold text-gray-800 text-base" id="filterModalTitle">اختر نوع الفلترة</h3>
                <button onclick="closeFilterModal()" class="text-gray-400 hover:text-red-500 p-1 rounded-xl">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="filterModalBody" class="space-y-2">
                <!-- المحتوى الديناميكي للخطوات -->
            </div>
        </div>
    </div>

    <!-- كود الجافاسكريبت لإدارة النظام والصفحات والـ RPC والفلترة -->
    <script>
        // ================= 1. المتغيرات وإعدادات الاتصال =================
        const SUPABASE_URL = 'https://glwwvrgvbfygqbmqlnfn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_bCXPU0JSPeF-tG4OkHSXsQ_wyyRyC0w';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUserId = null;
        let currentUserRole = "";
        let currentUserName = "";
        let currentUserPhone = "";

        let selectedBrand = "";
        let selectedModel = "";
        let selectedPart = "";
        let selectedModelCode = ""; 
        let currentScreenCompatibility = "";
        let currentBatteryModel = "";
        let heartbeatInterval = null;

        // كاشات مؤقتة للفلترة في الشاشات المختلفة
        window.allUserProfilesCache = [];
        window.allActiveUsersCache = [];
        window.allLoginHistoryCache = [];
        let activeFilterContext = ''; // تحديد الشاشة الحالية للفلتر ('profiles', 'active', 'login')

        // ================= الثوابت والدوال المساعدة للمحافظات =================
        const EGYPTIAN_GOVERNORATES = [
            "أسوان", "الأقصر", "قنا", "البحر الأحمر", "الوادي الجديد", "سوهاج", "أسيوط", 
            "المنيا", "بني سويف", "الجيزة", "القاهرة", "سيناء", "بورسعيد", "كفر الشيخ", 
            "دمياط", "الدقهلية", "الشرقية", "الغربية", "المنوفية", "الفيوم", "بحيرة", 
            "الإسكندرية", "مطروح"
        ];

        function getGovernoratesOptionsHtml(selectedValue = "") {
            return `<option value="">اختر المحافظة...</option>` + 
                EGYPTIAN_GOVERNORATES.map(gov => 
                    `<option value="${gov}" ${gov === selectedValue ? 'selected' : ''}>${gov}</option>`
                ).join('');
        }

        function getRegionsListForCity(city) {
            if (city === 'أسوان') {
                return ['إدفو', 'كوم أمبو', 'دراو', 'مركز أسوان'];
            } else if (city) {
                return [`${city} - عام`];
            }
            return [];
        }

        function getAreasListForRegion(region) {
            if (region === 'مركز أسوان') {
                return ['السيل', 'الطابية', 'النفق', 'التأمين'];
            } else if (region) {
                return ['عام'];
            }
            return [];
        }

        function updateRegionsDropdown(cityId, regionId, areaId) {
            const cityVal = document.getElementById(cityId)?.value;
            const regionSelect = document.getElementById(regionId);
            const areaSelect = document.getElementById(areaId);

            if (!regionSelect) return;

            const regions = getRegionsListForCity(cityVal);
            regionSelect.innerHTML = '<option value="">اختر المنطقة...</option>' + 
                regions.map(r => `<option value="${r}">${r}</option>`).join('');

            if (areaSelect) {
                areaSelect.innerHTML = '<option value="">اختر النطاق أولاً...</option>';
            }
        }

        function updateAreasDropdown(regionId, areaId) {
            const regionVal = document.getElementById(regionId)?.value;
            const areaSelect = document.getElementById(areaId);

            if (!areaSelect) return;

            const areas = getAreasListForRegion(regionVal);
            areaSelect.innerHTML = '<option value="">اختر النطاق...</option>' + 
                areas.map(a => `<option value="${a}">${a}</option>`).join('');
        }

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input || !icon) return;

            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
            } else {
                input.type = 'password';
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />`;
            }
        }

        function startHeartbeat() {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(async () => {
                if (!currentUserId) return;
                try {
                    await supabaseClient.rpc('update_last_active_at', { target_user_id: currentUserId });
                } catch (err) {
                    console.error("Heartbeat error:", err);
                }
            }, 10000);
        }

        // ================= نظام الفلترة المنبثق الهرمي العام =================
        function openFilterModal(context) {
            activeFilterContext = context;
            const overlay = document.getElementById('filterModalOverlay');
            const content = document.getElementById('filterModalContent');
            if (!overlay || !content) return;

            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);

            showMainFilterOptions();
        }

        function closeFilterModal() {
            const overlay = document.getElementById('filterModalOverlay');
            const content = document.getElementById('filterModalContent');
            if (!overlay || !content) return;

            overlay.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }

        function showMainFilterOptions() {
            const titleElem = document.getElementById('filterModalTitle');
            const bodyElem = document.getElementById('filterModalBody');
            if (!titleElem || !bodyElem) return;

            titleElem.innerText = 'اختر نوع الفلترة';
            
            let govButtonHtml = '';
            // شاشة بيانات المستخدمين تحتوي على محافظات، أما النشطين وسجل الدخول فلترة بالرتبة فقط أو حسب المتاح
            if (activeFilterContext === 'profiles') {
                govButtonHtml = `
                    <button onclick="showGovTypeOptions()" class="w-full bg-gray-50 hover:bg-blue-50 border border-gray-200 hover:border-blue-200 p-3.5 rounded-2xl text-right font-semibold text-gray-800 transition-all flex items-center justify-between cursor-pointer">
                        <span>فلترة بناءً على المحافظة</span>
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                `;
            }

            bodyElem.innerHTML = `
                <button onclick="showRoleFilterOptions()" class="w-full bg-gray-50 hover:bg-blue-50 border border-gray-200 hover:border-blue-200 p-3.5 rounded-2xl text-right font-semibold text-gray-800 transition-all flex items-center justify-between cursor-pointer">
                    <span>فلترة بناءً على الرتبة</span>
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
                ${govButtonHtml}
            `;
        }

        function showRoleFilterOptions() {
            const roles = ['أدمن', 'مدير', 'مندوب', 'تاجر', 'فنى'];
            document.getElementById('filterModalTitle').innerText = 'اختر الرتبة المطلوبة';
            document.getElementById('filterModalBody').innerHTML = `
                <button onclick="showMainFilterOptions()" class="text-xs text-blue-600 font-semibold mb-2 flex items-center gap-1 cursor-pointer">
                    <svg class="w-3.5 h-3.5 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    <span>رجوع للخلف</span>
                </button>
                <div class="space-y-2 max-h-60 overflow-y-auto">
                    ${roles.map(role => `
                        <button onclick="applyRoleFilter('${role}')" class="w-full bg-gray-50 hover:bg-blue-50 border border-gray-200 p-3 rounded-xl text-right font-semibold text-gray-800 transition-all cursor-pointer">
                            ${role}
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function showGovTypeOptions() {
            document.getElementById('filterModalTitle').innerText = 'اختر نوع المحافظة';
            document.getElementById('filterModalBody').innerHTML = `
                <button onclick="showMainFilterOptions()" class="text-xs text-blue-600 font-semibold mb-2 flex items-center gap-1 cursor-pointer">
                    <svg class="w-3.5 h-3.5 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    <span>رجوع للخلف</span>
                </button>
                <div class="space-y-2">
                    <button onclick="showGovernoratesList('store_city', 'محافظة المتجر')" class="w-full bg-gray-50 hover:bg-blue-50 border border-gray-200 p-3.5 rounded-xl text-right font-semibold text-gray-800 transition-all cursor-pointer">
                        محافظة المتجر
                    </button>
                    <button onclick="showGovernoratesList('shop_city', 'محافظة المحل')" class="w-full bg-gray-50 hover:bg-blue-50 border border-gray-200 p-3.5 rounded-xl text-right font-semibold text-gray-800 transition-all cursor-pointer">
                        محافظة المحل
                    </button>
                    <button onclick="showGovernoratesList('delivery_city', 'محافظة التوصيل')" class="w-full bg-gray-50 hover:bg-blue-50 border border-gray-200 p-3.5 rounded-xl text-right font-semibold text-gray-800 transition-all cursor-pointer">
                        محافظة التوصيل
                    </button>
                </div>
            `;
        }

        function showGovernoratesList(cityColumnKey, labelName) {
            document.getElementById('filterModalTitle').innerText = `اختر ${labelName}`;
            document.getElementById('filterModalBody').innerHTML = `
                <button onclick="showGovTypeOptions()" class="text-xs text-blue-600 font-semibold mb-2 flex items-center gap-1 cursor-pointer">
                    <svg class="w-3.5 h-3.5 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    <span>رجوع لأنواع المحافظات</span>
                </button>
                <div class="space-y-1.5 max-h-60 overflow-y-auto pr-1">
                    ${EGYPTIAN_GOVERNORATES.map(gov => `
                        <button onclick="applyGovFilter('${cityColumnKey}', '${gov}', '${labelName}')" class="w-full bg-gray-50 hover:bg-blue-50 border border-gray-200 p-2.5 rounded-xl text-right font-semibold text-gray-800 transition-all cursor-pointer text-xs sm:text-sm">
                            ${gov}
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function applyRoleFilter(role) {
            closeFilterModal();
            if (activeFilterContext === 'profiles') {
                const filtered = window.allUserProfilesCache.filter(user => user.user_role && user.user_role.trim() === role);
                renderProfilesTableHTML(filtered);
                showActiveFilterBadge(`فلتر نشط: الرتبة (${role})`, 'profiles');
            } else if (activeFilterContext === 'active') {
                const filtered = window.allActiveUsersCache.filter(user => user.user_role && user.user_role.trim() === role);
                renderActiveUsersTableHTML(filtered);
                showActiveFilterBadge(`فلتر نشط: الرتبة (${role})`, 'active');
            } else if (activeFilterContext === 'login') {
                const filtered = window.allLoginHistoryCache.filter(item => item.user_role && item.user_role.trim() === role);
                renderLoginHistoryTableHTML(filtered);
                showActiveFilterBadge(`فلتر نشط: الرتبة (${role})`, 'login');
            }
        }

        function applyGovFilter(columnKey, govName, labelName) {
            closeFilterModal();
            if (activeFilterContext === 'profiles') {
                const filtered = window.allUserProfilesCache.filter(user => user[columnKey] && user[columnKey].trim() === govName);
                renderProfilesTableHTML(filtered);
                showActiveFilterBadge(`فلتر نشط: ${labelName} (${govName})`, 'profiles');
            }
        }

        function showActiveFilterBadge(text, context) {
            const badge = document.getElementById('activeFilterBadge');
            const badgeText = document.getElementById('activeFilterText');
            const resetBtn = document.getElementById('resetFilterBtn');

            if (badge && badgeText && resetBtn) {
                badgeText.innerText = text;
                badge.classList.remove('hidden');
                resetBtn.classList.remove('hidden');
            }
        }

        function resetUserFilters(context) {
            const badge = document.getElementById('activeFilterBadge');
            const resetBtn = document.getElementById('resetFilterBtn');

            if (badge) badge.classList.add('hidden');
            if (resetBtn) resetBtn.classList.add('hidden');

            if (context === 'profiles') {
                renderProfilesTableHTML(window.allUserProfilesCache);
            } else if (context === 'active') {
                renderActiveUsersTableHTML(window.allActiveUsersCache);
            } else if (context === 'login') {
                renderLoginHistoryTableHTML(window.allLoginHistoryCache);
            }
        }

        // ================= 2. شاشة بيانات المستخدمين =================
        async function renderUserProfilesScreen() {
            toggleSidebar();
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-3 flex-shrink-0 flex-wrap gap-2">
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 cursor-pointer">
                            <svg class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            <span>رجوع</span>
                        </button>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="openFilterModal('profiles')" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 shadow-sm cursor-pointer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                            <span>فلترة البيانات</span>
                        </button>
                        <button type="button" onclick="resetUserFilters('profiles')" id="resetFilterBtn" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-xl text-xs font-semibold transition-all cursor-pointer">
                            إلغاء الفلتر
                        </button>
                    </div>
                </div>
                <div id="activeFilterBadge" class="hidden bg-blue-50 border border-blue-200 text-blue-700 px-3 py-1.5 rounded-xl text-xs font-semibold mb-3 flex items-center justify-between flex-shrink-0">
                    <span id="activeFilterText">---</span>
                </div>
                <h2 class="text-sm sm:text-base font-bold text-gray-800 mb-2">بيانات المستخدمين</h2>
                <div id="userProfilesTableContainer" class="flex-1 overflow-y-auto p-1">
                    <div class="text-center text-gray-400 text-sm py-8">جاري جلب بيانات المستخدمين...</div>
                </div>
            `;

            loadDynamicMenuIntoSidebar();
            const tableContainer = document.getElementById('userProfilesTableContainer');
            try {
                const { data, error } = await supabaseClient.rpc('get_user_profiles', { p_user_id: currentUserId });
                if (error) {
                    tableContainer.innerHTML = `<div class="text-center text-red-400 text-sm py-8">خطأ في جلب البيانات: ${error.message}</div>`;
                    return;
                }
                let profilesList = Array.isArray(data) ? data : (typeof data === 'string' ? JSON.parse(data) : []);
                window.allUserProfilesCache = profilesList;
                renderProfilesTableHTML(profilesList);
            } catch (err) {
                tableContainer.innerHTML = `<div class="text-center text-red-400 text-sm py-8">حدث خطأ غير متوقع</div>`;
            }
        }

        function renderProfilesTableHTML(profilesList) {
            const tableContainer = document.getElementById('userProfilesTableContainer');
            if (!tableContainer) return;
            if (profilesList.length > 0) {
                tableContainer.innerHTML = `
                    <div class="overflow-x-auto rounded-2xl border border-gray-200 shadow-sm">
                        <table class="w-full text-right text-xs sm:text-sm whitespace-nowrap">
                            <thead class="bg-gray-50 text-gray-700 border-b border-gray-200">
                                <tr>
                                    <th class="p-3.5 font-bold">الرتبة</th>
                                    <th class="p-3.5 font-bold">الاسم</th>
                                    <th class="p-3.5 font-bold">اسم المتجر</th>
                                    <th class="p-3.5 font-bold">محافظة المتجر</th>
                                    <th class="p-3.5 font-bold">منطقة المتجر</th>
                                    <th class="p-3.5 font-bold">نطاق المتجر</th>
                                    <th class="p-3.5 font-bold">عنوان المتجر</th>
                                    <th class="p-3.5 font-bold">اسم المحل</th>
                                    <th class="p-3.5 font-bold">محافظة المحل</th>
                                    <th class="p-3.5 font-bold">منطقة المحل</th>
                                    <th class="p-3.5 font-bold">نطاق المحل</th>
                                    <th class="p-3.5 font-bold">عنوان المحل</th>
                                    <th class="p-3.5 font-bold">محافظة التوصيل</th>
                                    <th class="p-3.5 font-bold">منطقة التوصيل</th>
                                    <th class="p-3.5 font-bold">نطاق التوصيل</th>
                                    <th class="p-3.5 font-bold">رقم الهاتف</th>
                                    <th class="p-3.5 font-bold">رقم الواتساب</th>
                                    <th class="p-3.5 font-bold">البريد الإلكترونى</th>
                                    <th class="p-3.5 font-bold">رمز المرور</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 bg-white">
                                ${profilesList.map(user => `
                                    <tr class="hover:bg-blue-50/50 transition-all">
                                        <td class="p-3.5 font-bold text-blue-600" dir="auto">${user.user_role || '---'}</td>
                                        <td class="p-3.5 font-semibold text-gray-800" dir="auto">${user.user_name || '---'}</td>
                                        <td class="p-3.5 text-gray-700" dir="auto">${user.store_name || '---'}</td>
                                        <td class="p-3.5 text-gray-700" dir="auto">${user.store_city || '---'}</td>
                                        <td class="p-3.5 text-gray-700" dir="auto">${user.store_region || '---'}</td>
                                        <td class="p-3.5 text-gray-700" dir="auto">${user.store_area || '---'}</td>
                                        <td class="p-3.5 text-gray-700" dir="auto">${user.store_address || '---'}</td>
                                        <td class="p-3.5 text-gray-700" dir="auto">${user.shop_name || '---'}</td>

                            <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-wide">Electricity</h1>
                        </div>
                        <div class="mb-6">
                            <img src="https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=800&q=80" alt="Banner" class="w-full h-40 sm:h-52 object-cover rounded-2xl shadow-md">
                        </div>
                        <div class="bg-gray-100 p-1.5 rounded-2xl flex items-center mb-6 border border-gray-200">
                            <button class="flex-1 bg-white text-blue-600 font-bold py-2.5 rounded-xl shadow-sm text-sm transition-all">تسجيل الدخول</button>
                            <button onclick="alert('شاشة إنشاء حساب')" class="flex-1 text-gray-500 font-semibold py-2.5 rounded-xl text-sm transition-all hover:text-gray-700">إنشاء حساب</button>
                        </div>
                        <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">رقم الهاتف</label>
                                <input type="text" id="loginPhone" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50" dir="ltr">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">رمز المرور</label>
                                <div class="relative">
                                    <input type="password" id="loginPassword" required class="w-full px-4 py-3 pl-12 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-gray-50" dir="ltr">
                                    <button type="button" onclick="togglePasswordVisibility('loginPassword', 'loginEyeIcon')" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-blue-600 focus:outline-none p-1">
                                        <svg id="loginEyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
                                    </button>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <input type="checkbox" id="rememberMe" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 cursor-pointer">
                                <label for="rememberMe" class="text-xs font-semibold text-gray-600 cursor-pointer">تذكرني</label>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all text-sm">تسجيل الدخول</button>
                        </form>
                        <div class="relative my-6"><div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div><div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-gray-400">أو</span></div></div>
                        <div><button onclick="loginAsVisitor()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 rounded-xl transition-all text-sm border border-gray-200">الدخول كزائر</button></div>
                    </div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            const { data, error } = await supabaseClient.rpc('login', { p_phone_number: phone, p_password: password });
            if (error || !data || !data.id) {
                alert("بيانات الدخول غير صحيحة");
                return;
            }

            currentUserId = data.id; 
            try {
                const profileRes = await supabaseClient.rpc('get_personal_profile', { p_user_id: currentUserId });
                if (profileRes.data && profileRes.data.success !== false) {
                    currentUserRole = profileRes.data.user_role || '';
                    currentUserName = profileRes.data.user_name || '';
                    currentUserPhone = profileRes.data.phone_number || '';
                }
            } catch (err) {}

            startHeartbeat();
            renderMainDashboard();
            loadDynamicMenuIntoSidebar(); 
        }

        function loginAsVisitor() {
            currentUserId = null;
            currentUserRole = "";
            currentUserName = "";
            currentUserPhone = "";
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            renderMainDashboard();
            loadDynamicMenuIntoSidebar();
        }

        async function renderMainDashboard() {
            const html = `
                ${getHeaderTemplate()}
                <div class="flex-1 overflow-y-auto space-y-4 px-1">
                    <div class="mb-4"><img src="https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=800&q=80" alt="Banner" class="w-full h-36 sm:h-48 object-cover rounded-2xl shadow-md"></div>
                    <div id="partitionsContainer" class="space-y-3.5 pb-4"><div class="text-center text-gray-400 text-sm py-4">جاري تحميل الأقسام...</div></div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
            loadDynamicMenuIntoSidebar();

            try {
                const { data, error } = await supabaseClient.rpc('get_partitions');
                let partitionsList = Array.isArray(data) ? data : (typeof data === 'string' ? JSON.parse(data) : []);
                const container = document.getElementById('partitionsContainer');
                if (container && partitionsList && partitionsList.length > 0) {
                    container.innerHTML = partitionsList.map(name => `
                        <div onclick="alert('قسم ${name}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-5 sm:p-6 rounded-2xl shadow-md cursor-pointer transition-all flex items-center justify-between">
                            <span class="font-bold text-lg sm:text-xl" dir="auto">${name}</span>
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </div>
                    `).join('');
                }
            } catch (err) {}
        }

        window.onload = function() {
            renderLoginScreen();
        };
    </script>
</body>
</html>
