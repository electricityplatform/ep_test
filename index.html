<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاموس المصطلحات</title>
    <!-- استيراد خط عربي حديث -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #38bdf8;
            font-size: 1.8rem;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            padding: 0 20px;
            border-radius: 12px;
            border: none;
            background-color: #0ea5e9;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0284c7;
        }

        .result-container {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .word-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .word-header h2 {
            font-size: 1.5rem;
            color: #f1f5f9;
        }

        .phonetic {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .audio-btn {
            background: #334155;
            border: none;
            color: #38bdf8;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .audio-btn:hover {
            background: #475569;
        }

        .meaning-group {
            margin-bottom: 16px;
        }

        .part-of-speech {
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
        }

        .definition-item {
            margin-bottom: 8px;
            padding-right: 15px;
            border-right: 2px solid #334155;
        }

        .definition {
            color: #e2e8f0;
        }

        .example {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 4px;
            font-style: italic;
        }

        .error-message {
            text-align: center;
            color: #ef4444;
            background-color: #1e293b;
            padding: 16px;
            border-radius: 12px;
            display: none;
        }

        .loading {
            text-align: center;
            color: #94a3b8;
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>قاموس البحث السريع</h1>
        
        <div class="search-box">
            <input type="text" id="wordInput" placeholder="اكتب كلمة بالإنجليزية للبحث عنها..." />
            <button onclick="searchWord()">بحث</button>
        </div>

        <div id="loading" class="loading">جاري البحث...</div>
        <div id="errorMessage" class="error-message">عذراً، لم يتم العثور على الكلمة المطلوبة.</div>

        <div id="resultContainer" class="result-container">
            <div class="word-header">
                <div>
                    <h2 id="resultWord">Word</h2>
                    <span id="resultPhonetic" class="phonetic"></span>
                </div>
                <button id="audioBtn" class="audio-btn" style="display:none;" onclick="playAudio()">🔊 استماع</button>
            </div>
            <div id="meaningsContainer"></div>
        </div>
    </div>

    <script>
        let audioUrl = '';

        // السماح بالبحث عند الضغط على زر Enter
        document.getElementById('wordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchWord();
            }
        });

        async function searchWord() {
            const word = document.getElementById('wordInput').value.trim();
            const resultContainer = document.getElementById('resultContainer');
            const errorMessage = document.getElementById('errorMessage');
            const loading = document.getElementById('loading');
            const audioBtn = document.getElementById('audioBtn');

            if (!word) return;

            // إخفاء النتائج القديمة وإظهار التحميل
            resultContainer.style.display = 'none';
            errorMessage.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
                
                if (!response.ok) {
                    throw new Error('Word not found');
                }

                const data = await response.json();
                const entry = data[0];

                // عرض الكلمة والنطق
                document.getElementById('resultWord').textContent = entry.word;
                document.getElementById('resultPhonetic').textContent = entry.phonetic || (entry.phonetics.find(p => p.text) || {}).text || '';

                // البحث عن رابط الصوت إن وجد
                const phoneticWithAudio = entry.phonetics.find(p => p.audio && p.audio.trim() !== '');
                if (phoneticWithAudio) {
                    audioUrl = phoneticWithAudio.audio;
                    audioBtn.style.display = 'block';
                } else {
                    audioUrl = '';
                    audioBtn.style.display = 'none';
                }

                // عرض المعاني والأقسام
                const meaningsContainer = document.getElementById('meaningsContainer');
                meaningsContainer.innerHTML = '';

                entry.meanings.forEach(meaning => {
                    const group = document.createElement('div');
                    group.className = 'meaning-group';

                    const pos = document.createElement('div');
                    pos.className = 'part-of-speech';
                    pos.textContent = meaning.partOfSpeech;
                    group.appendChild(pos);

                    meaning.definitions.slice(0, 3).forEach(def => {
                        const defItem = document.createElement('div');
                        defItem.className = 'definition-item';

                        const defText = document.createElement('div');
                        defText.className = 'definition';
                        defText.textContent = def.definition;
                        defItem.appendChild(defText);

                        if (def.example) {
                            const exText = document.createElement('div');
                            exText.className = 'example';
                            exText.textContent = `مثال: "${def.example}"`;
                            defItem.appendChild(exText);
                        }

                        group.appendChild(defItem);
                    });

                    meaningsContainer.appendChild(group);
                });

                loading.style.display = 'none';
                resultContainer.style.display = 'block';

            } data => {
                // خطأ في جلب البيانات
                loading.style.display = 'none';
                errorMessage.style.display = 'block';
            } catch (error) {
                loading.style.display = 'none';
                errorMessage.style.display = 'block';
            }
        }

        function playAudio() {
            if (audioUrl) {
                const audio = new Audio(audioUrl);
                audio.play();
            }
        }
    </script>
</body>
</html>
